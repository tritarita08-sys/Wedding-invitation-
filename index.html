<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wedding Invitation</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;
  background:#000;
  scroll-behavior:smooth;
  overflow-x:hidden;
}

.page{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
}

/* PAGE 1 */
#page1 video{
  width:100%;
  height:100%;
  object-fit:contain;
}

#tapToOpen{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:20;

  padding:16px 34px;
  border-radius:50px;

  background:rgba(255,255,255,.94);
  color:#222;

  font-family:Georgia,serif;
  font-size:20px;
  font-weight:bold;
  letter-spacing:2px;

  box-shadow:0 8px 30px rgba(0,0,0,.35);
  transition:.35s;
  cursor:pointer;
}

#tapToOpen.hide{
  opacity:0;
  transform:translate(-50%,-50%) scale(.75);
  pointer-events:none;
}

/* VIDEO PAGES */
.videoPage video{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

/* PAGE 3 */
#page3{background:#000}

.page3Box{
  position:relative;
  width:min(100vw,125vh);
  aspect-ratio:25/20;
  overflow:hidden;
  background:#000;
}

#page3Video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

/* COUNTDOWN */
#countdown{
  position:absolute;
  left:50%;
  bottom:6%;
  transform:translateX(-50%);
  z-index:5;

  width:86%;
  padding:13px 15px;

  text-align:center;
  color:#fff;

  font-family:Georgia,serif;
  font-size:clamp(17px,3.5vw,32px);
  font-weight:bold;
  letter-spacing:1px;

  background:rgba(0,0,0,.48);
  border:1.5px solid rgba(255,255,255,.9);
  border-radius:16px;

  backdrop-filter:blur(5px);

  text-shadow:0 2px 7px #000,0 0 14px rgba(255,255,255,.8);
  box-shadow:0 0 18px rgba(255,255,255,.28);
}

/* SCRATCH */
#scratchCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:10;
  touch-action:none;
  cursor:crosshair;
}

#scratchText{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:15;

  color:#fff;
  font-family:Georgia,serif;
  font-size:clamp(24px,5vw,44px);
  font-weight:bold;
  letter-spacing:3px;
  white-space:nowrap;

  text-shadow:0 2px 7px #000,0 0 16px rgba(255,255,255,.6);

  pointer-events:none;
  animation:pulse 1.5s infinite ease-in-out;
  transition:opacity .2s;
}

#scratchText.hide{
  opacity:0;
  animation:none;
}

@keyframes pulse{
  0%,100%{transform:translate(-50%,-50%) scale(1)}
  50%{transform:translate(-50%,-50%) scale(1.06)}
}

/* CONFETTI */
#confettiContainer{
  position:fixed;
  inset:0;
  z-index:9999;
  pointer-events:none;
  overflow:hidden;
}

.confetti{
  position:absolute;
  top:-30px;
  opacity:0;
  border-radius:2px;
  animation:fall linear forwards;
}

@keyframes fall{
  0%{
    opacity:1;
    transform:translate3d(0,-30px,0) rotate(0deg);
  }
  100%{
    opacity:0;
    transform:translate3d(var(--drift),110vh,0) rotate(var(--rotation));
  }
}

/* LOCATION */
.locationPage{
  min-height:100vh;
  background:#f5f5f5;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.locationCard{
  width:min(90vw,480px);
  background:#fff;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,.18);
}

.locationPreview{
  height:240px;
  position:relative;

  background:
    linear-gradient(
      rgba(220,230,220,.65),
      rgba(220,230,220,.65)
    );

  display:flex;
  align-items:center;
  justify-content:center;

  font-family:Georgia,serif;
  font-size:25px;
  font-weight:bold;
  color:#444;
}

.locationPreview:after{
  content:"📍";
  position:absolute;
  font-size:45px;
  transform:translateY(-45px);
}

.locationInfo{padding:20px}

.locationTitle{
  font-family:Georgia,serif;
  font-size:21px;
  font-weight:bold;
  margin-bottom:7px;
}

.locationText{
  color:#777;
  font-size:14px;
  line-height:1.5;
}

.locationButton{
  display:block;
  margin-top:17px;
  padding:14px;
  text-align:center;
  text-decoration:none;
  color:#fff;
  background:#222;
  border-radius:11px;
  font-weight:bold;
}

/* MOBILE */
@media(max-width:600px){
  #tapToOpen{
    font-size:17px;
    padding:14px 27px;
  }

  #countdown{
    width:91%;
    font-size:17px;
    padding:10px 8px;
  }

  #scratchText{
    font-size:27px;
  }

  .locationPreview{
    height:190px;
  }
}
</style>
</head>

<body>

<!-- PAGE 1 : page.mp4 -->
<section class="page" id="page1">
  <video id="page1Video"
         src="page.mp4"
         playsinline
         preload="metadata"
         muted></video>

  <div id="tapToOpen">Tap to Open</div>
</section>


<!-- PAGE 2 -->
<section class="page videoPage">
  <video src="page2.mp4"
         playsinline
         muted
         preload="metadata"></video>
</section>


<!-- PAGE 3 -->
<section class="page" id="page3">

  <div class="page3Box">

    <video id="page3Video"
           src="page3.mp4"
           playsinline
           muted
           loop
           preload="metadata"></video>

    <div id="countdown">Loading...</div>

    <canvas id="scratchCanvas"></canvas>

    <div id="scratchText">Scratch Here</div>

  </div>

</section>


<!-- PAGE 4 -->
<section class="page videoPage">
  <video src="page4.mp4"
         playsinline
         muted
         preload="metadata"></video>
</section>


<!-- PAGE 5 -->
<section class="page videoPage">
  <video src="page5.mp4"
         playsinline
         muted
         preload="metadata"></video>
</section>


<!-- PAGE 6 -->
<section class="page videoPage">
  <video src="page6.mp4"
         playsinline
         muted
         preload="metadata"></video>
</section>


<!-- LOCATION -->
<section class="locationPage">

  <div class="locationCard">

    <div class="locationPreview">
      Location
    </div>

    <div class="locationInfo">

      <div class="locationTitle">
        Wedding Location
      </div>

      <div class="locationText">
        Tap below to view the location.
      </div>

      <a class="locationButton"
         href="https://share.google/lQPPTbf7PM"
         target="_blank">
        View Location
      </a>

    </div>

  </div>

</section>


<div id="confettiContainer"></div>


<script>

/* =========================
   PAGE 1 TAP TO OPEN
========================= */

const tapToOpen=document.getElementById("tapToOpen");
const page1Video=document.getElementById("page1Video");

let opened=false;

tapToOpen.addEventListener("click",async()=>{

  if(opened)return;

  opened=true;

  /* TAP TO OPEN DISAPPEARS */
  tapToOpen.classList.add("hide");

  /* PAGE 1 VIDEO STARTS */
  page1Video.muted=false;

  try{
    await page1Video.play();
  }catch(e){
    page1Video.muted=true;
    await page1Video.play().catch(()=>{});
  }

  /* SONG STARTS ONLY AFTER TAP */
  const song=new Audio("Song.mp3");
  song.loop=true;
  song.volume=1;
  song.play().catch(()=>{});

});


/* =========================
   VIDEO PAGE PLAY/PAUSE
========================= */

const videos=document.querySelectorAll(".videoPage video");

const observer=new IntersectionObserver(entries=>{

  entries.forEach(entry=>{

    const video=entry.target;

    if(entry.isIntersecting){
      video.play().catch(()=>{});
    }else{
      video.pause();
    }

  });

},{threshold:.35});

videos.forEach(video=>observer.observe(video));


/* =========================
   PAGE 3 VIDEO
========================= */

const page3Video=document.getElementById("page3Video");

const page3Observer=new IntersectionObserver(entries=>{

  entries.forEach(entry=>{

    if(entry.isIntersecting){
      page3Video.play().catch(()=>{});
    }else{
      page3Video.pause();
    }

  });

},{threshold:.2});

page3Observer.observe(page3Video);


/* =========================
   COUNTDOWN
   24 NOVEMBER 2026
   DATE IS NOT DISPLAYED
========================= */

const targetDate=
new Date("2026-11-24T00:00:00+05:30").getTime();

const countdown=
document.getElementById("countdown");

function updateCountdown(){

  const difference=targetDate-Date.now();

  if(difference<=0){
    countdown.innerHTML="The Big Day Is Here!";
    return;
  }

  const days=Math.floor(
    difference/(1000*60*60*24)
  );

  const hours=Math.floor(
    (difference/(1000*60*60))%24
  );

  const minutes=Math.floor(
    (difference/(1000*60))%60
  );

  const seconds=Math.floor(
    (difference/1000)%60
  );

  countdown.innerHTML=
    `${days} Days&nbsp;&nbsp;`+
    `${hours} Hours&nbsp;&nbsp;`+
    `${minutes} Minutes&nbsp;&nbsp;`+
    `${seconds} Seconds`;
}

updateCountdown();
setInterval(updateCountdown,1000);


/* =========================
   SCRATCH
========================= */

const canvas=
document.getElementById("scratchCanvas");

const ctx=canvas.getContext("2d");

const scratchText=
document.getElementById("scratchText");

const scratchImage=new Image();
scratchImage.src="Scratch.jpg";

let scratching=false;
let started=false;
let confettiDone=false;

function resizeCanvas(){

  const rect=canvas.getBoundingClientRect();

  const dpr=window.devicePixelRatio||1;

  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;

  ctx.setTransform(dpr,0,0,dpr,0,0);

  drawScratchImage();
}

function drawScratchImage(){

  const w=canvas.clientWidth;
  const h=canvas.clientHeight;

  ctx.globalCompositeOperation="source-over";

  ctx.clearRect(0,0,w,h);

  if(scratchImage.complete){

    ctx.drawImage(
      scratchImage,
      0,
      0,
      w,
      h
    );

  }
}

scratchImage.onload=resizeCanvas;

window.addEventListener("resize",resizeCanvas);


function getPosition(event){

  const rect=canvas.getBoundingClientRect();

  return{
    x:event.clientX-rect.left,
    y:event.clientY-rect.top
  };
}


function startScratch(event){

  scratching=true;

  /* SCRATCH HERE DISAPPEARS ON FIRST TOUCH */

  if(!started){

    started=true;
    scratchText.classList.add("hide");

  }

  scratch(event);
}


function scratch(event){

  if(!scratching)return;

  const pos=getPosition(event);

  ctx.globalCompositeOperation="destination-out";

  ctx.beginPath();

  ctx.arc(
    pos.x,
    pos.y,
    32,
    0,
    Math.PI*2
  );

  ctx.fill();

  checkScratch();
}


function stopScratch(){
  scratching=false;
}


canvas.addEventListener(
  "pointerdown",
  startScratch
);

canvas.addEventListener(
  "pointermove",
  scratch
);

canvas.addEventListener(
  "pointerup",
  stopScratch
);

canvas.addEventListener(
  "pointercancel",
  stopScratch
);


/* =========================
   SCRATCH PROGRESS
========================= */

let lastCheck=0;

function checkScratch(){

  const now=Date.now();

  if(now-lastCheck<250)return;

  lastCheck=now;

  const width=canvas.width;
  const height=canvas.height;

  const data=ctx.getImageData(
    0,
    0,
    width,
    height
  ).data;

  let transparent=0;
  let total=0;

  const step=12;

  for(let y=0;y<height;y+=step){

    for(let x=0;x<width;x+=step){

      const index=
        ((y*width+x)*4)+3;

      total++;

      if(data[index]<80){
        transparent++;
      }

    }
  }

  const percentage=
    transparent/total*100;

  /* 55% SCRATCHED = CONFETTI */

  if(
    percentage>=55 &&
    !confettiDone
  ){

    confettiDone=true;

    ctx.clearRect(
      0,
      0,
      canvas.clientWidth,
      canvas.clientHeight
    );

    launchConfetti();
  }
}


/* =========================
   CONFETTI
========================= */

function launchConfetti(){

  const container=
    document.getElementById(
      "confettiContainer"
    );

  const colors=[
    "#FFD700",
    "#FF4D6D",
    "#4D96FF",
    "#6BCB77",
    "#FF9F1C",
    "#C77DFF",
    "#FFFFFF"
  ];

  for(let i=0;i<180;i++){

    const piece=
      document.createElement("div");

    piece.className="confetti";

    piece.style.width=
      (Math.random()*8+5)+"px";

    piece.style.height=
      (Math.random()*12+7)+"px";

    piece.style.left=
      Math.random()*100+"vw";

    piece.style.background=
      colors[
        Math.floor(
          Math.random()*colors.length
        )
      ];

    piece.style.setProperty(
      "--drift",
      (Math.random()*350-175)+"px"
    );

    piece.style.setProperty(
      "--rotation",
      (Math.random()*1600-800)+"deg"
    );

    piece.style.animationDuration=
      (Math.random()*3+3)+"s";

    piece.style.animationDelay=
      (Math.random()*.8)+"s";

    container.appendChild(piece);

    setTimeout(
      ()=>piece.remove(),
      6000
    );
  }
}

</script>

</body>
  </html>
